name: Credential-free checks
# Sharded for speed, complete by construction: the `logic` (-m "not browser") and `browser` (-m browser) suites are split into deterministic shards (tests/conftest.py),
# and the `gate` job (the single required status check) fails unless every shard passed AND the union of the shards equals a full collection (scripts/ci_check_shards.py).
# A scheduled/manual unsharded run (full.yml) cross-checks the result.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  ANONYMIZED_TELEMETRY: "false"
  BROWSER_USE_CLOUD_SYNC: "false"
  BROWSER_USE_DISABLE_EXTENSIONS: "1"
  BROWSER_USE_CONFIG_DIR: ${{ github.workspace }}/artifacts/browser-config
jobs:
  logic:
    name: logic ${{ matrix.shard }}/2
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.lock') }}
      - name: Install locked dependencies and fresh package
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
          python -m playwright install --with-deps chromium
      - name: Unit and offline adapter checks (shard ${{ matrix.shard }}/2)
        run: python -m pytest -m "not browser" -q --num-shards 2 --shard-id ${{ matrix.shard }} --shard-ids-file artifacts/shards/logic/shard-${{ matrix.shard }}.ids
      - name: Credential-free CLI smoke
        if: matrix.shard == 1
        run: readiness smoke --output runs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ids-logic-${{ matrix.shard }}
          path: artifacts/shards/logic/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-logic-${{ matrix.shard }}
          path: |
            runs/
          if-no-files-found: ignore
          retention-days: 7
  browser:
    name: browser ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.lock') }}
      - name: Install locked dependencies and fresh package
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
          python -m playwright install --with-deps chromium
      - name: Browser information boundary checks (shard ${{ matrix.shard }}/4)
        run: python -m pytest -m browser -q --basetemp=artifacts/browser-tests --num-shards 4 --shard-id ${{ matrix.shard }} --shard-ids-file artifacts/shards/browser/shard-${{ matrix.shard }}.ids
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ids-browser-${{ matrix.shard }}
          path: artifacts/shards/browser/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-browser-${{ matrix.shard }}
          path: |
            artifacts/browser-tests/
          if-no-files-found: ignore
          retention-days: 7
  gate:
    name: gate (required check)
    needs: [logic, browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Every shard succeeded
        run: |
          echo "logic=${{ needs.logic.result }} browser=${{ needs.browser.result }}"
          test "${{ needs.logic.result }}" = success && test "${{ needs.browser.result }}" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies (collection only; no browser)
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: ids-*
          path: shards
      - name: Shards partition the full collection (nothing lost, nothing duplicated)
        run: |
          mkdir -p all/logic all/browser
          cp shards/ids-logic-*/*.ids all/logic/
          cp shards/ids-browser-*/*.ids all/browser/
          python scripts/ci_check_shards.py all/logic all/browser
