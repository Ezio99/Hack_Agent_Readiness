name: Credential-free checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ANONYMIZED_TELEMETRY: "false"
      BROWSER_USE_CLOUD_SYNC: "false"
      BROWSER_USE_DISABLE_EXTENSIONS: "1"
      BROWSER_USE_CONFIG_DIR: ${{ github.workspace }}/artifacts/browser-config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies and fresh package
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
          python -m playwright install --with-deps chromium
      - name: Unit and offline adapter checks
        run: python -m pytest -m "not browser" -q
      - name: Browser information boundary checks
        run: python -m pytest -m browser -q --basetemp=artifacts/browser-tests
      - name: Credential-free CLI smoke
        if: success()
        run: readiness smoke --output runs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credential-free-evidence
          path: |
            runs/
            artifacts/browser-tests/
          if-no-files-found: ignore
          retention-days: 7
