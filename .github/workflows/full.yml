name: Full unsharded regression (cross-check)
# The complete suite in one job, exactly as it ran before sharding. Scheduled daily and runnable by hand; it does not gate merges.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANONYMIZED_TELEMETRY: "false"
      BROWSER_USE_CLOUD_SYNC: "false"
      BROWSER_USE_DISABLE_EXTENSIONS: "1"
      BROWSER_USE_CONFIG_DIR: ${{ github.workspace }}/artifacts/browser-config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies and fresh package
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
          python -m playwright install --with-deps chromium
      - run: mkdir -p artifacts   # pytest --basetemp needs its parent to exist on a fresh checkout (it is git-ignored); without it the first tests error at setup
      - name: Let the browser jail build its namespaces (Ubuntu 24.04 AppArmor; this job's Python interpreter only)
        # Ubuntu 24.04 sets kernel.apparmor_restrict_unprivileged_userns=1: a new user namespace gets no capabilities, so the jail's setup
        # (setgroups, loopback up, its private mounts) fails with EACCES/EPERM and the jail fails closed. This grants only the AppArmor `userns`
        # permission, only to the interpreter that runs the jail, on this ephemeral runner. The jail code, its isolation and its self-test are
        # unchanged; production runs the jail in a container with its own settings (deploy/compose.yaml).
        run: |
          PY=$(readlink -f "$(command -v python)")
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile ar-jail-python %s flags=(unconfined) {\n  userns,\n}\n' "$PY" | sudo tee /etc/apparmor.d/ar-jail-python
          sudo apparmor_parser -r /etc/apparmor.d/ar-jail-python
      - run: python -m pytest -q --basetemp=artifacts/browser-tests
      - name: Credential-free CLI smoke
        run: readiness smoke --output runs
